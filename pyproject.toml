[project]
name = "lancedb-kb-mcp"
version = "0.1.0"
description = "A knowledge base MCP server on LanceDB: hybrid search, notes, folder ingest and versions, all in one local folder."
readme = "README.md"
authors = [
    { name = "Hien Hoang", email = "hoangchunghien@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "lancedb>=0.41.0",
    "mcp[cli]>=2.3.0",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
lance-kb = "lancedb_kb_mcp.cli:main"
lancedb-kb-mcp = "lancedb_kb_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
